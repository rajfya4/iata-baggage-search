server:
  port: 8080
  tomcat:
    threads:
      max: 10
  shutdown: graceful

spring:
  datasource:
    url: jdbc:h2:mem:iata_search;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.iata.search: DEBUG

