spring:
  datasource:
    url: jdbc:h2:mem:iata_search_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

ai:
  llm:
    api-key: test-key
    model: test-model
    provider: test
